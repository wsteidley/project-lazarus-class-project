[project]
name = "lazarus-extract"
version = "0.1.0"
description = "Binary-workbook extractors for Project Lazarus (reads .xlsb; TypeScript owns the derived schema)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2",
  "pyxlsb>=1.0.10",
]

# Kept separate from resolve/ on purpose: this project exists to read a spreadsheet, and
# folding it into the Splink project would make every extractor run pull that whole
# dependency tree. irena_capacity.py is a script, not an installed package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
